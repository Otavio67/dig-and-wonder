name: Validate Godot project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: bash setup-cloud.sh
      - name: Import and boot project
        run: bash check-project.sh
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: .tools/logs/
          if-no-files-found: ignore
